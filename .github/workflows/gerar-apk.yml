# Gera o APK do Leco e publica o site a cada envio para a branch main
# (ou manualmente em Actions › "Gerar APK e site do Leco" › Run workflow).
name: Gerar APK e site do Leco

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: leco-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testes:
    # Testes automáticos: se algo falhar, o APK e o site não são publicados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Instalar o navegador de testes
        run: npx playwright install --with-deps chromium
      - name: Testar o agente do WhatsApp
        run: node tests/whatsapp-agent.mjs
      - name: Testar o app (celular simulado)
        run: |
          set -o pipefail
          node tests/app.e2e.mjs 2>&1 | tee e2e.log || { echo "::error title=Testes do app falharam::$(grep -E '✗|falha|erro' e2e.log | tail -20 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }


  whatsapp:
    # Publica o agente do WhatsApp no Supabase (só roda se o segredo SUPABASE_ACCESS_TOKEN existir)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar token
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Agente do WhatsApp não publicado: falta o segredo SUPABASE_ACCESS_TOKEN."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ok == 'true'
        with:
          version: latest
      - name: Publicar função whatsapp
        if: steps.check.outputs.ok == 'true'
        run: |
          REF=$(node -p "new URL(require('./leco.config.json').supabaseUrl).hostname.split('.')[0]")
          supabase functions deploy whatsapp --project-ref "$REF" --no-verify-jwt --use-api || { echo "::error::Falha ao publicar a função do WhatsApp no Supabase (confira o SUPABASE_ACCESS_TOKEN)."; exit 1; }
          echo "::notice::Agente do WhatsApp publicado em https://$REF.supabase.co/functions/v1/whatsapp"
  site:
    needs: testes
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Montar o site
        run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Conferir a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.LECO_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.LECO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LECO_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Faltam os segredos LECO_KEYSTORE_BASE64, LECO_KEYSTORE_PASSWORD e LECO_KEY_ALIAS. Veja o LEIA-ME.md."
            exit 1
          fi

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Montar o app (React + Tailwind + Supabase)
        run: |
          set -o pipefail
          LECO_BUILD=${{ github.run_number }} npm run build:native 2>&1 | tee web.log || { echo "::error title=Falha ao montar o app::$(tail -40 web.log | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }

      - name: Criar o projeto Android
        run: |
          set -o pipefail
          { npx cap add android && cp -r resources/android/res/* android/app/src/main/res/ && node tools/patch-android.cjs && npx cap sync android; } 2>&1 | tee cap.log || {
            echo "::error title=Falha ao criar o projeto Android::$(tail -45 cap.log | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

      - name: Definir a versão
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Compilar
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee ../gradle.log || {
            echo "::error title=Falha ao compilar::$(grep -E 'FAILURE|What went wrong|error:|Error|>' ../gradle.log | tail -45 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

      - name: Assinar o APK
        env:
          KEYSTORE_BASE64: ${{ secrets.LECO_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.LECO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LECO_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > leco-release.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk alinhado.apk
          "$BT/apksigner" sign --ks leco-release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KS_PASS --out "Leco-$VERSION.apk" alinhado.apk
          "$BT/apksigner" verify "Leco-$VERSION.apk"
          rm -f leco-release.jks alinhado.apk

      - name: Guardar o APK nesta execução
        uses: actions/upload-artifact@v4
        with:
          name: Leco-${{ env.VERSION }}-build-${{ github.run_number }}
          path: Leco-*.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build${{ github.run_number }}
          name: Leco ${{ env.VERSION }} (build ${{ github.run_number }})
          make_latest: true
          body: |
            Baixe o ficheiro `Leco-${{ env.VERSION }}.apk` abaixo no celular e toque nele para instalar.
            Se já tem o Leco instalado, esta versão atualiza o app.
            Versão web: https://thesousaleo.github.io/Leco/
          files: Leco-*.apk
